name: Build Mac DMG

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    # macos-latest es Apple Silicon (arm64), así que el DMG salía arm64 puro y
    # NO arranca en una Mac Intel: Rosetta 2 traduce x86→arm, no al revés.
    # Compilando en Intel el DMG sale x64, que corre nativo en Intel y bajo
    # Rosetta 2 en Apple Silicon — un solo artefacto que sirve en las dos.
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies + PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python server
        run: pyinstaller server.spec

      # El DMG sale SIN credenciales. Antes este paso escribía las keys del
      # repo en dist/server/.env y viajaban en texto plano dentro del .app:
      # cualquiera con el DMG podía sacarlas y gastar la cuota. Ahora cada
      # usuario pega la suya en Ajustes (cifrada con safeStorage, main.js) y
      # Electron se la pasa al servidor por variable de entorno.
      #
      # Esta guarda falla el build si algún .env se cuela en el bundle.
      - name: Verificar que no viajen credenciales
        run: |
          if find dist/server -name '.env*' | grep -q .; then
            echo "::error::Hay un .env dentro de dist/server: las keys irían en el DMG"
            exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build and publish DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
